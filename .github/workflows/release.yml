name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Fails fast, before spinning up either OS job, if whoever cut the tag
  # forgot to bump CMakeLists.txt's project(VERSION ...) to match it — a
  # release otherwise ships packages internally labelled with the wrong
  # version.
  check-version:
    name: check tag matches PROJECT_VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(grep -oP '(?<=VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt PROJECT_VERSION $version"
            exit 1
          fi

  linux-packages:
    name: package (ubuntu-latest)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # dpkg is already present on ubuntu-latest; rpmbuild is not.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Package
        working-directory: build/linux-release
        run: cpack -G "DEB;RPM"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux-release/hungryeditor-*.deb
            build/linux-release/hungryeditor-*.rpm

  appimage-package:
    name: package (appimage)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # patchelf: used by linuxdeploy to rewrite bundled binaries' RPATHs.
      # FUSE is not needed -- packaging/appimage/build.sh already runs the
      # downloaded AppImage tools with --appimage-extract-and-run.
      # libqt6serialport6: nothing in hungryeditor uses serial ports, but
      # linuxdeploy-plugin-qt unconditionally bundles every Qt Positioning
      # backend plugin it finds (Positioning is pulled in transitively by
      # WebEngine's Geolocation API), including the NMEA-GPS one, which
      # links against it -- without it installed, deployment aborts with
      # "Could not find dependency: libQt6SerialPort.so.6" rather than just
      # skipping that one plugin.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libqt6serialport6

      - name: Build the AppImage
        run: packaging/appimage/build.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/appimage/hungryeditor-*.AppImage

  flatpak-package:
    name: package (flatpak)
    needs: check-version
    runs-on: ubuntu-latest
    container:
      # No kde-6.8 tag exists yet for this image (6.7 is the newest as of
      # writing); the action still fetches the manifest's actual
      # runtime-version (6.8) from Flathub at build time regardless; the
      # tag just picks the container's own toolchain/glibc base.
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: hungryeditor.flatpak
          manifest-path: packaging/flatpak/io.github.dagike.Hungryeditor.yml
          cache: false

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: hungryeditor.flatpak

  windows-packages:
    name: package (windows-latest)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      # Relies on the WiX Toolset v3 CLI (candle/light) that windows-latest
      # ships pre-installed, the same way the main CI workflow relies on
      # that image shipping cdb — unverified beyond that reliance, since this
      # repo has no Windows environment of its own to test the WIX generator
      # or windeployqt discovery in cmake/Packaging.cmake against.
      - name: Package
        working-directory: build/windows-release
        run: cpack -G "WIX;ZIP"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows-release/hungryeditor-*.msi
            build/windows-release/hungryeditor-*.zip
