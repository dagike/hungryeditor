name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-progress runs on a branch/PR, but let every push to master run
  # so a fast series of commits cannot skip CI.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 6.4.2 matches the version in Ubuntu's apt repositories.
          - os: ubuntu-latest
            preset: linux-debug
            qt_version: 6.4.2
          # windows-latest ships a preview MSVC toolset that dropped
          # stdext::checked_array_iterator; Qt's headers only stop using it
          # in 6.8, so pin the Windows build to the current 6.8 line.
          - os: windows-latest
            preset: windows-release
            qt_version: 6.8.3

    steps:
      - uses: actions/checkout@v4

      # Groundwork for the planned WebView2 preview backend (not yet built):
      # answers, empirically and on every run, whether the Evergreen runtime
      # is present on this image and what the SDK nupkg's header/lib layout
      # looks like, so the eventual FetchContent pin targets a version whose
      # shape is actually known rather than assumed from docs. Informational
      # only — never fails the job.
      - name: Probe the WebView2 runtime and SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "::group::Evergreen WebView2 runtime (registry)"
          $clientId = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientId",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientId"
          )
          $found = $false
          foreach ($key in $keys) {
            $entry = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
            if ($entry) {
              $found = $true
              Write-Host "$key -> pv=$($entry.pv)"
            }
          }
          if (-not $found) {
            Write-Host "no Evergreen runtime registration found under any of the usual keys"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::WebView2 SDK nupkg layout (pinned 1.0.4191.47)"
          $nupkg = "$env:RUNNER_TEMP\webview2.nupkg.zip"
          $extractDir = "$env:RUNNER_TEMP\webview2-sdk"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4191.47/microsoft.web.webview2.1.0.4191.47.nupkg" -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath $extractDir -Force
          Get-ChildItem -Recurse $extractDir | Select-Object -ExpandProperty FullName
          Write-Host "::endgroup::"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WebEngine runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxdamage1 libxkbcommon-x11-0 libxkbfile1 \
            libxcomposite1 libxrandr2 libxtst6 libasound2t64 \
            libgstreamer-gl1.0-0 libgstreamer-plugins-base1.0-0

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      # On Windows a failing Qt Test's buffered stdout never reaches ctest, so
      # --output-on-failure prints nothing. Re-run the failed executables under
      # cdb, which flushes their output and also yields a stack on a real crash.
      - name: Report crashed/failed tests (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "cdb not found; skipping"; exit 0 }
          $log = & ctest --preset ${{ matrix.preset }} 2>&1
          $failed = [regex]::Matches(($log -join "`n"), '(?m)^\s*\d+ - (\S+) \(Failed\)') |
            ForEach-Object { $_.Groups[1].Value }
          if (-not $failed) { Write-Host "no failed tests to trace"; exit 0 }
          foreach ($name in $failed) {
            $exe = "build/${{ matrix.preset }}/bin/$name.exe"
            Write-Host "::group::cdb $name"
            & $cdb -G -lines -c "sxe av; g; .lastevent; .exr -1; kn 200; q" $exe 2>&1 |
              Select-String -NotMatch 'PASS   :|SKIP   :|QDEBUG :'
            Write-Host "::endgroup::"
          }

  webview2-sdk-configure:
    name: configure webview2 backend (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Configure-only: proves cmake/WebView2.cmake's pinned FetchContent
      # actually resolves and the SDK's include directory wires up. No
      # WebView2 backend source exists yet (see
      # src/preview/PreviewBackendFactory.cpp), so there is nothing to build
      # or test on this path today.
      - name: Configure with the webview2 backend
        run: cmake --preset windows-release -DHUNGRYEDITOR_PREVIEW_BACKEND=webview2

  release-benchmarks:
    name: release benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install WebEngine runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxdamage1 libxkbcommon-x11-0 libxkbfile1 \
            libxcomposite1 libxrandr2 libxtst6 libasound2t64 \
            libgstreamer-gl1.0-0 libgstreamer-plugins-base1.0-0

      - name: Configure
        run: cmake --preset linux-release -DHUNGRYEDITOR_STRICT_BENCHMARKS=ON

      - name: Build
        run: cmake --build --preset linux-release

      # Only test_benchmarks: the rest of the suite is already covered by
      # the ordinary build job above, and a release build changes nothing
      # about correctness — just the numbers this job exists to check.
      - name: Run benchmarks against the plan's real targets
        run: ctest --preset linux-release --output-on-failure -R '^test_benchmarks$'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
          QTWEBENGINE_DISABLE_SANDBOX: 1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h')
          printf '%s\n' "${files[@]}"
          clang-format --dry-run --Werror "${files[@]}"

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.4.2
          modules: qtwebengine qtwebchannel qtpositioning qt5compat
          cache: true

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure (for compile_commands.json)
        run: cmake --preset linux-debug

      - name: Run clang-tidy on first-party sources
        run: |
          # tests/ is skipped: the Qt Test files #include a generated .moc that
          # only exists after a build, and configure alone is enough for src/.
          mapfile -t files < <(git ls-files 'src/*.cpp')
          printf '%s\n' "${files[@]}"
          clang-tidy -p build/linux-debug "${files[@]}"
