# flatpak-builder manifest. Build locally with:
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.dagike.Hungryeditor.yml
#
# Needs org.kde.Platform/Sdk and the QtWebEngine base app installed first:
#   flatpak install flathub org.kde.Platform//6.8 org.kde.Sdk//6.8 \
#       io.qt.qtwebengine.BaseApp//6.8
#
# The plain org.kde.Platform/Sdk runtime does NOT include QtWebEngine (it's
# a separate, Chromium-sized build Flathub ships once as a shared "base app"
# rather than having every Qt WebEngine app rebuild it) -- omitting `base`
# below fails find_package(Qt6 ... WebEngineWidgets) before hungryeditor's
# own CMakeLists.txt is ever reached. `base`/`base-version` must track
# `runtime-version` (io.qt.qtwebengine.BaseApp publishes one branch per KDE
# runtime line, confirmed against https://github.com/flathub/org.kde.falkon
# and https://github.com/flathub/org.kde.kdevelop, two real Flathub apps
# using QtWebEngine on the KDE runtime the same way); bump all three
# together if Flathub moves the runtime on.
app-id: io.github.dagike.Hungryeditor
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.8'
command: hungryeditor

# Strips build-only files the base app's SDK layer leaves behind (headers,
# CMake/pkg-config files, static libs) — the same cleanup falkon and
# kdevelop both run for the same reason.
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /mkspecs
  - '*.la'
  - '*.a'
cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  # Windowing: both are listed so the app works on an X11 or a Wayland
  # session without a rebuild; --share=ipc is needed alongside --socket=x11.
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # GPU access for QtWebEngine's compositing.
  - --device=dri
  # Broad but the practical choice for an editor with its own file-tree
  # sidebar and command-line file opening, not just a single-document
  # portal dialog. --filesystem=host is the wider alternative if files
  # outside $HOME (e.g. another mounted drive) need to be reachable too.
  - --filesystem=home

modules:
  - name: hungryeditor
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      # Building from the local checkout this manifest ships in. Swap for a
      # `type: git, url: https://github.com/dagike/hungryeditor, tag: vX.Y.Z`
      # source for an actual Flathub submission (see 10.6, release
      # automation) — a real submission needs to build from a tagged commit,
      # not whatever happens to be on disk.
      - type: dir
        path: ../..
